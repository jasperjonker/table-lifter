plugins { id 'com.android.application' }

android {
    namespace 'com.jasper.tablelifter'
    compileSdk 37
    defaultConfig {
        applicationId 'com.jasper.tablelifter'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'no.nordicsemi.android:mcumgr-ble:3.4.1'
}
